<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lifestyle · Wenzuo Xia</title>
  <link rel="stylesheet" href="earth.css">
  <style>
    .password-container {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      gap: 10px;
      animation: fadeIn 1s ease-out;
    }

    input[type="password"], button {
      padding: 10px;
      font-size: 18px;
      border: none;
      border-bottom: 1px solid white;
      border-radius: 0;
      outline: none;
      background: transparent;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      transition: border-color 0.3s, color 0.3s;
    }
    input[type="password"] { width: 220px; user-select: text; -webkit-user-select: text; }
    input[type="password"]:focus { border-bottom: 2px solid #ff5555; }
    button { padding: 10px 20px; cursor: pointer; }
    button:hover { border-bottom-color: #ff5555; color: #ff5555; }
    button:disabled { opacity: 0.5; cursor: wait; }

    #message {
      position: absolute;
      top: 200px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      color: #ff5555;
      text-shadow: 1px 1px 0 #000;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .password-container { top: 100px; width: calc(100% - 40px); }
      input[type="password"] { flex: 1; width: auto; min-width: 0; }
      #message { top: 160px; }
    }
  </style>
</head>
<body>

<header id="main-header" onclick="window.location.href='index.html'">Wenzuo Xia</header>

<form class="password-container" id="loginForm">
  <input type="password" id="passwordInput" placeholder="Enter Password" autocomplete="current-password" autofocus>
  <button type="submit" id="submitBtn">Submit</button>
</form>
<div id="message" role="status"></div>

<div id="loading">Loading assets...</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script src="earth.js"></script>

<script type="module">
  import { auth, FRIENDS_EMAIL, OWNER_EMAIL, FB_SDK } from "./firebase-config.js";
  const { signInWithEmailAndPassword, onAuthStateChanged } = await import(`${FB_SDK}/firebase-auth.js`);

  const form = document.getElementById('loginForm');
  const input = document.getElementById('passwordInput');
  const button = document.getElementById('submitBtn');
  const message = document.getElementById('message');
  // Where to go after logging in: ?next=ideas.html, otherwise the life archive.
  const NEXT = ['lifestyle.html', 'ideas.html'].includes(new URLSearchParams(location.search).get('next'))
    ? new URLSearchParams(location.search).get('next') : 'lifestyle.html';

  // Already logged in on this browser → go straight in.
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.replace(NEXT);
  });

  async function tryLogin(email, password) {
    try {
      await signInWithEmailAndPassword(auth, email, password);
      return true;
    } catch (err) {
      if (err.code === 'auth/too-many-requests') throw err;
      return false;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = input.value;
    if (!password) return;

    button.disabled = true;
    message.textContent = '';
    try {
      // The friends password and your own password are different, so trying
      // both accounts lets one box work for everyone.
      const ok = (await tryLogin(FRIENDS_EMAIL, password)) ||
                 (await tryLogin(OWNER_EMAIL, password));
      if (ok) {
        window.location.replace(NEXT);
      } else {
        message.textContent = "No no, it's private.";
        input.value = '';
        input.focus();
      }
    } catch (err) {
      message.textContent = 'Too many tries. Wait a few minutes.';
    } finally {
      button.disabled = false;
    }
  });
</script>

</body>
</html>
