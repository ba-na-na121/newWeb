<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Wenzuo Xia</title>
  <meta name="description" content="Wenzuo Xia — artworks, digital works, games and ideas.">
  <link rel="stylesheet" href="earth.css">
  <style>
    #left-nav, #right-nav {
      position: absolute;
      top: 120px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 30px;
      animation: navIn 1s ease-out;
    }
    #left-nav { left: 60px; }
    #right-nav { right: 60px; text-align: right; }

    #left-nav a, #right-nav a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      transition: all 0.3s ease;
      text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
      font-family: 'Courier New', Courier, monospace;
    }
    #left-nav a:hover, #right-nav a:hover {
      color: #ff5555;
      text-decoration: underline;
    }

    @keyframes navIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Phones: links sit in two columns under the name, earth stays in the middle */
    @media (max-width: 600px) {
      #left-nav, #right-nav { top: 80px; gap: 14px; }
      #left-nav { left: 20px; }
      #right-nav { right: 20px; }
      #left-nav a, #right-nav a { font-size: 16px; }
    }
  </style>
</head>

<body>
<header id="main-header" onclick="window.location.href='index.html'">Wenzuo Xia</header>

<nav id="left-nav">
  <a href="password.html">Lifestyle</a>
  <a href="artworks.html">Artworks</a>
  <a href="https://ba-na-na121.github.io/Website/" target="_blank" rel="noopener">Digital Works</a>
</nav>

<nav id="right-nav">
  <a href="ideas.html">Ideas</a>
  <a href="games.html">Games</a>
  <a href="contactInfo.html">Contact Info</a>
</nav>

<div id="loading">Loading assets...</div>

<footer>Made by Wenzuo Xia · <span id="year">2025</span></footer>

<script>window.EARTH_SHOW_HUD = true;</script>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<script src="earth.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
