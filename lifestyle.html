<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Lifestyle · Wenzuo Xia</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lifestyle.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Wenzuo Xia<small>LIFE ARCHIVE</small></a>
      <nav class="tabs">
        <button class="tab active" data-view="archive">Archive</button>
        <button class="tab" data-view="map">Map</button>
        <button class="tab" data-view="add" id="addTab" hidden>+ Add</button>
        <button class="tab quiet" id="logoutBtn">Log out</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- ARCHIVE -->
    <section id="archiveView">
      <p class="stats" id="stats">Loading…</p>
      <div class="filters">
        <input class="field search" id="q" type="search" placeholder="Search text, tags, places…">
        <select class="field" id="year"><option value="">All years</option></select>
        <select class="field" id="category"><option value="">All categories</option></select>
        <label class="toggle"><input type="checkbox" id="savedOnly"> ★ Saved</label>
      </div>
      <div class="chips" id="tagChips"></div>
      <div id="timeline"></div>
    </section>

    <!-- MAP -->
    <section id="mapView" hidden>
      <div id="map"></div>
    </section>

    <!-- ADD (owner only) -->
    <section id="addView" class="add" hidden>
      <h2>Add to the archive</h2>
      <p class="hint">
        Pick photos and videos. Dates and places are read from the photos when they have them,
        and photos from the same day become one entry. You can change anything before uploading.
        Photos are shrunk for the website — keep your originals in iCloud.
      </p>

      <label class="drop" id="drop">
        <input type="file" id="files" multiple accept="image/*,video/*">
        <span id="dropText">Tap to choose files, or drop them here</span>
      </label>

      <div class="row">
        <label>Category for all
          <select class="field" id="bulkCategory"></select>
        </label>
        <label>Tags for all (comma separated)
          <input class="field" id="bulkTags" placeholder="e.g. summer, nyc">
        </label>
      </div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="groupByDay" checked> Same day → one entry</label>
        <label class="toggle"><input type="checkbox" id="autoAi" checked> ✨ AI fills in title, tags and category</label>
      </div>

      <div class="groups" id="groups"></div>

      <div class="row" id="uploadRow" hidden>
        <button class="btn primary" id="uploadBtn">Upload all</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
    </section>
  </main>

  <script type="module" src="lifestyle.js"></script>
</body>
</html>
