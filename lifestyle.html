<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>生活档案 · Wenzuo Xia</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="lifestyle.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回首页">Wenzuo Xia</a>
    <nav class="actions" aria-label="档案">
      <a class="icon-btn" href="#/search" data-icon="search" aria-label="搜索" title="搜索"></a>
      <a class="icon-btn" href="#/map" data-icon="map" aria-label="地图" title="地图"></a>
      <a class="icon-btn add-btn" href="#/add" data-icon="plus" id="addTab" aria-label="添加照片" title="添加照片" hidden></a>
      <button class="icon-btn" type="button" data-icon="logout" id="logoutBtn" aria-label="退出登录" title="退出登录"></button>
    </nav>
  </header>

  <main>
    <!-- BROWSE: folders, timeline, a folder, a year, a month, search, one entry (filled in by lifestyle.js) -->
    <section id="browseView" aria-live="polite">
      <p class="loading">正在加载档案…</p>
    </section>

    <!-- MAP -->
    <section id="mapView" hidden>
      <div class="page-head">
        <a class="back" href="#/" data-icon="chevron-left" aria-label="返回"></a>
        <h1 class="page-title">地图</h1>
      </div>
      <div id="map"></div>
    </section>

    <!-- ADD (owner only) -->
    <section id="addView" class="add" hidden>
      <div class="page-head">
        <a class="back" href="#/" data-icon="chevron-left" aria-label="返回"></a>
        <h1 class="page-title">添加到档案</h1>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="files" multiple accept="image/*,video/*">
        <span class="drop-icon" data-icon="upload"></span>
        <span class="drop-title" id="dropText">选择照片和视频</span>
        <span class="drop-sub">日期和地点会自动读取，同一天、同一地点的会合成一条</span>
      </label>

      <details class="add-settings">
        <summary><span data-icon="edit"></span> 设置</summary>
        <div class="row">
          <label>分类（全部）
            <select class="field" id="bulkCategory"></select>
          </label>
          <label>标签（全部，用逗号分隔）
            <input class="field" id="bulkTags" placeholder="夏天, 纽约">
          </label>
        </div>
        <label class="toggle"><input type="checkbox" id="groupByDay" checked> 同一天、同一地点的照片合成一条</label>
        <label class="toggle"><input type="checkbox" id="autoAi" checked> <span class="inline-icon" data-icon="sparkle"></span> 让 AI 填写标题、标签和分类</label>
      </details>

      <div class="groups" id="groups"></div>

      <div class="upload-dock" id="uploadRow" hidden>
        <div class="dock-status">
          <span class="dock-summary" id="dockSummary"></span>
          <span class="progress" id="progress"></span>
          <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
        </div>
        <div class="dock-buttons">
          <button class="btn" id="clearBtn">清空</button>
          <button class="btn primary" id="uploadBtn">全部上传</button>
        </div>
      </div>

      <details class="log">
        <summary>详细记录：读取和上传情况</summary>
        <button class="btn small" id="copyLog" type="button">复制记录</button>
        <pre id="log"></pre>
      </details>

      <p class="legal">照片会为网站压缩，原图请继续保存在 iCloud。<br>
        AI 建议受 reCAPTCHA 保护，适用 Google
        <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">隐私权政策</a>和
        <a href="https://policies.google.com/terms" target="_blank" rel="noopener">服务条款</a>。
      </p>
    </section>
  </main>

  <script type="module" src="lifestyle.js"></script>
</body>
</html>
