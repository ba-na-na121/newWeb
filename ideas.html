<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>灵感 · Wenzuo Xia</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="lifestyle.css">
  <link rel="stylesheet" href="ideas.css">
</head>
<body class="ideas-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回首页">Wenzuo Xia</a>
    <nav class="actions" aria-label="灵感">
      <a class="icon-btn" href="#/shopping" data-icon="bag" id="shopTab" aria-label="购物清单" title="购物清单" hidden></a>
      <button class="icon-btn add-btn" type="button" data-icon="plus" id="addBtn" aria-label="上传灵感图" title="上传灵感图" hidden></button>
      <button class="icon-btn" type="button" data-icon="logout" id="logoutBtn" aria-label="退出登录" title="退出登录"></button>
    </nav>
  </header>

  <main>
    <section id="view" aria-live="polite">
      <p class="loading">正在加载灵感…</p>
    </section>
  </main>

  <!-- Upload progress (owner only) -->
  <div class="tray" id="tray" hidden>
    <div class="tray-head">
      <b id="trayTitle">上传中</b>
      <button class="chip-btn icon-only" type="button" id="trayClose" aria-label="收起" data-icon="close"></button>
    </div>
    <ul class="tray-list" id="trayList"></ul>
  </div>

  <input type="file" id="files" multiple accept="image/*" hidden>
  <script type="module" src="ideas.js"></script>
</body>
</html>
